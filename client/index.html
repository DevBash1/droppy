<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#0066FF" />
        <title>Droppy — Dropshipping Importer</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            /* Pre-React loading state: shown from first byte until JS mounts.
               React clears #root when it renders, hiding this automatically. */
            body { margin: 0; background: #f3f9ff; }
            #root-init {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }
            #root-init .ring {
                width: 32px;
                height: 32px;
                border: 3px solid #d9efff;
                border-top-color: #0066ff;
                border-radius: 50%;
                animation: spin 0.65s linear infinite;
            }
            @keyframes spin { to { transform: rotate(360deg); } }
        </style>
    </head>
    <body>
        <div id="root">
            <div id="root-init"><div class="ring"></div></div>
        </div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
